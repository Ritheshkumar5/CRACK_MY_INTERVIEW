{% extends "base.html" %}
{% block title %}Register | Crack My Interview{% endblock %}
{% block page_name %}register{% endblock %}
{% block content %}
<section class="auth-wrapper">
  <div class="container">
    <div class="card auth-card">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p class="muted">Register to start your interview preparation journey.</p>
      </div>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="full_name">Full Name *</label>
          <input type="text" id="full_name" name="full_name" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone (Optional)</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-15 digits">
        </div>
        <div class="input-row">
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm Password *</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
          </div>
        </div>
        <div id="registerMessage" class="form-error"></div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="auth-footer-text">Already have an account? <a href="/login">Login</a></p>
    </div>
  </div>
</section>
{% endblock %}
